  previous_sample_utilization_callback:
    module: src.callbacks.instance.previous_sample_utilization_callback.PreviousSampleUtilizationCallback
    parameters:
      original_first_user_prompt: task.chat_history_item_factory.construct(0, 'user')
      seed_session_list_path: null
      utilized_sample_count: 3
  usage_logging_callback:
    module: src.callbacks.instance.usage_logging_callback.UsageLoggingCallback
environment_config:
  use_task_client_flag: false
language_model_dict:
  Llama-3.1-8B-Instruct-Ollama:
    module: src.language_models.instance.openai_language_model.OpenaiLanguageModel
    parameters:
      api_key: ollama
      base_url: http://localhost:11434/v1
      model_name: llama3.1:8b
      role_dict:
        agent: assistant
        user: user
logger_config:
  level: INFO
  log_file_path: default
  logger_name: lifelong_agent_bench
task_dict:
  db_bench:
    module: src.tasks.instance.db_bench.DBBench
    parameters:
      chat_history_item_factory:
        module: src.factories.chat_history_item.ChatHistoryItemFactory
        parameters:
          chat_history_item_dict_path: ./chat_history_items/previous_sample_utilization/db_bench.json
      data_file_path: ./data/v0303/db_bench/processed/v0317_first500/entry_dict.json
      max_round: 3
      task_name:
        module: src.typings.TaskName
        parameters:
          value: db_bench
